name: background_operation_failures
title: "后台merge/fetch/mutation反复失败"
severity: warning
description: |
  最近24小时中的某一小时内，同一种类、同一错误码的后台操作失败超过50次
  （每小时、每种事件类型和每个错误码各生成一个实例）。system.part_log
  记录每次merge、mutation、fetch（DownloadPart）和part删除及其错误码；
  反复失败是查询异常在后台的对应现象，且从不出现在query_log中。

  常见错误码：999 KEEPER_EXCEPTION（merge无法提交——Keeper会话丢失）、
  236 ABORTED（merge在关闭时或因part消失而被取消）、
  241 MEMORY_LIMIT_EXCEEDED（merge对pool而言过大）、
  499 S3_ERROR / 107 FILE_DOESNT_EXIST（fetch期间对象存储问题或文件缺失）、
  84 / 504 *_ALREADY_EXISTS（半提交操作后的重试）。

  排查：查看示例message、同一批表的system.merges / system.mutations、
  同一错误码的system.errors，以及该小时metric_log中Keeper和内存相关指标。
tags:
  - merges
  - replication
  - reliability

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:background_operation_failures
source:
  - system.part_log_3_days
  - system.version
query: |
  SELECT
    toStartOfHour(event_time)   AS hour,
    event_type,
    error,
    count()                     AS failures,
    any(exception)              AS example_message
  FROM {sys.part_log}
  WHERE event_time > now() - INTERVAL 24 HOUR
    AND error != 0
  GROUP BY hour, event_type, error
  HAVING failures > 50
  ORDER BY failures DESC
  LIMIT 24

message: "{failures}个{event_type}操作在{hour}开始的一小时内以错误码{error}失败——示例：{example_message}"
