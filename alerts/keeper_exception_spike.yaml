name: keeper_exception_spike
title: "Keeper/ZooKeeper exceptions spiking (code 999)"
severity: warning
description: |
  More than 20 Keeper exception errors (code 999 — KEEPER_EXCEPTION) in a
  single hour of the last 24 hours (one alert instance per such hour).
  These errors mean ClickHouse failed to complete a coordination request
  with ClickHouse Keeper or ZooKeeper. The window is a day, not an hour,
  because bundles are usually collected after recovery — a rule that
  only looks at the last hour is blind to the incident it is meant to
  surface.

  Ongoing Keeper exceptions can block DDL operations, stall replication,
  and prevent mutations from completing. Common causes include Keeper
  network issues, session expiry, Keeper overload, or a Keeper leader
  election in progress.

  Check: system.replication_queue for stuck entries, Keeper logs for
  leadership changes, and whether affected queries were DDL or writes
  to replicated tables.
tags:
  - keeper
  - replication
  - reliability

query: |
  SELECT
    toStartOfHour(event_time) AS hour,
    count()                   AS error_count,
    any(exception)            AS example_message
  FROM {sys.query_log}
  WHERE event_time > now() - INTERVAL 24 HOUR
    AND exception_code = 999
    AND type = 'ExceptionWhileProcessing'
  GROUP BY hour
  HAVING error_count > 20
  ORDER BY hour

message: "Keeper exception (code 999) fired {error_count} times in the hour starting {hour} — example: {example_message}"
