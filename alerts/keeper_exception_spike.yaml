name: keeper_exception_spike
title: "Keeper/ZooKeeper异常激增（错误码999）"
severity: warning
description: |
  最近24小时中的某一小时内，Keeper异常错误（错误码999——KEEPER_EXCEPTION）
  超过20次（每个此类小时生成一个告警实例）。这些错误意味着ClickHouse
  未能完成与ClickHouse Keeper或ZooKeeper的协调请求。窗口是一天而不是
  一小时，因为bundle通常是在恢复之后采集的——只看最后一小时的规则
  无法看到它本应揭示的事件。

  持续的Keeper异常会阻塞DDL操作、拖住replication，并阻止mutation完成。
  常见原因包括Keeper网络问题、会话过期、Keeper过载，或Keeper leader
  选举正在进行。

  排查：system.replication_queue中是否有卡住的条目、Keeper日志中的
  领导权变更，以及受影响的查询是DDL还是对replicated表的写入。
tags:
  - keeper
  - replication
  - reliability

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:keeper_exception_spike
source:
  - system.query_log_exceptions_1_day
  - system.version
query: |
  SELECT
    toStartOfHour(event_time) AS hour,
    count()                   AS error_count,
    any(exception)            AS example_message
  FROM {sys.query_log}
  WHERE event_time > now() - INTERVAL 24 HOUR
    AND exception_code = 999
    AND type = 'ExceptionWhileProcessing'
  GROUP BY hour
  HAVING error_count > 20
  ORDER BY hour

message: "Keeper异常（错误码999）在{hour}开始的一小时内触发了{error_count}次——示例：{example_message}"
