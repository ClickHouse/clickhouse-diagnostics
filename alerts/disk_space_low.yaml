name: disk_space_low
title: "Disk free space below 15%"
severity: critical
description: |
  One or more disks have less than 15% free space. ClickHouse needs
  disk headroom for merges, mutations, and temporary files. When a disk
  fills completely, inserts will fail and the server may enter read-only
  mode. Act before reaching 5% free space.

  Immediate actions: drop old partitions or TTL-expired data, move
  tables to a larger disk, or increase disk capacity. Check
  system.parts for the largest tables and system.disks for per-disk
  breakdown.

  Self-managed only. On a service whose data lives on object storage the
  disks that hold the data report 16 EiB free and can never trip this, while
  the local disk is the filesystem cache and sits near-full by design — it is
  sized to be filled. Measured on a healthy ClickHouse Cloud service: one
  replica's local disk was 14.57 GiB free of 99.43 GiB, 14.7 %, which fired
  this rule at critical with nothing wrong. A critical that a healthy service
  produces on every run teaches the reader to skip it, so the rule is gated to
  the modes where the local disk is the data disk. The numbers are still in
  system.disks, and the pre-pass re-reads the same thresholds for a cloud
  bundle's local disk at a severity that matches what it is: information below
  15 % free, a warning below 5 % because that filesystem also holds temporary
  files for merges and spilled sorts.
tags:
  - storage
  - disk
  - reliability

# Local disks on a cloud service are the filesystem cache, not capacity —
# see the description. Data on object storage never reaches 15 %.
modes: [onprem, gov]

# Subquery aliases free_space / total_space to numeric *_b columns
# first; the outer SELECT then formats and divides on the numeric
# values. Without this split, in CH 25+ the alias
# `formatReadableSize(free_space) AS free_space` shadows the source
# UInt64 column in the WHERE clause, and `free_space / total_space`
# becomes a String/String divide → ILLEGAL_TYPE_OF_ARGUMENT.
#
# {sys.disks} — not a hard-coded system.disks. Disks are per-replica, and
# hostName() attributes each row to the replica that reported it, so on a
# multi-replica self-managed cluster one node at 3% free is both detected and
# actionable rather than hidden behind whichever node answered. The
# placeholder resolves to the plain table in the two modes this rule runs in;
# it keeps the cloud form only so the rule stays correct if the gate above is
# ever widened — do not read the gate as "cloud is handled elsewhere", read
# the description: on a cloud service the local disk is the cache and the data
# disks are object storage, so there is nothing here for the rule to judge.
query: |
  SELECT
    hostname,
    disk_name,
    formatReadableSize(free_space_b)               AS free_space,
    formatReadableSize(total_space_b)              AS total_space,
    round(free_space_b / total_space_b * 100, 1)   AS free_pct
  FROM (
    SELECT
      hostName()                                   AS hostname,
      name                                         AS disk_name,
      free_space                                   AS free_space_b,
      total_space                                  AS total_space_b
    FROM {sys.disks}
    WHERE total_space > 0
      AND free_space / total_space < 0.15
  )
  ORDER BY free_pct ASC

message: "Disk '{disk_name}' on {hostname} is only {free_pct}% free ({free_space} of {total_space})"
