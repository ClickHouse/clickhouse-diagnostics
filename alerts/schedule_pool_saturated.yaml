name: schedule_pool_saturated
title: "Background schedule pool saturated for hours"
severity: warning
description: |
  In at least 3 of the last 24 hours the hourly average of
  CurrentMetric_BackgroundSchedulePoolTask on a replica was at or above 95% of
  background_schedule_pool_size. A saturated pool is a queue with no queue: work
  that finds no free slot is dropped and retried later, silently.
  The schedule pool (background_schedule_pool_size, default 512) runs every
  table's periodic tasks — parts updates, cleanup, replication queue checks;
  with tens of thousands of replicated tables it is the first pool to pin.
  On a SharedMergeTree cluster a saturated fetch pool means new parts become
  visible on this replica minutes to hours late — reads return fewer rows than
  the same query on a sibling replica, and a restart helps only until the pool
  fills again. The lasting fix is capacity: the pool size (applied on config
  reload for the fetch pool), fewer and larger inserts, fewer tables and parts.

  Check: metric_log_7_days avg_/max_schedule_pool_tasks per hour against
  the size; part_log DownloadPart per hour; on SMT, per-replica
  max_block_number for a hot table (system.parts across replicas).
tags:
  - background-pools
  - capacity
  - replication

# Per replica (hostName()): a cluster-wide average would hide one saturated
# node among idle ones. The pool size is read from {sys.settings};
# in cloud mode that table fans out too, so max() folds the replicas' values
# (they are the same on a homogeneous cluster) into one scalar.
query: |
  WITH (
      SELECT max(toUInt64OrZero(value))
      FROM {sys.settings}
      WHERE name = 'background_schedule_pool_size'
    ) AS pool_size,
    per_hour AS
    (
      SELECT
        hostName()                              AS hostname,
        toStartOfHour(event_time)               AS hour,
        avg(CurrentMetric_BackgroundSchedulePoolTask) AS avg_tasks
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname, hour
    )
  SELECT
    hostname,
    count()                                              AS hours_saturated,
    round(avg(avg_tasks), 1)                             AS avg_tasks_in_pool,
    pool_size,
    round(100 * avg(avg_tasks) / greatest(pool_size, 1)) AS pct_of_size
  FROM per_hour
  WHERE pool_size > 0
    AND avg_tasks >= 0.95 * pool_size
  GROUP BY hostname
  HAVING hours_saturated >= 3
  ORDER BY hours_saturated DESC, hostname
  LIMIT 100

message: "{hostname}: background schedule pool at {pct_of_size}% of its size ({avg_tasks_in_pool} of background_schedule_pool_size = {pool_size}) for {hours_saturated} of the last 24 hours"
