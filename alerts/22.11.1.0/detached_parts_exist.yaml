# 22.11+变体：通过detached_parts.bytes_on_disk（22.11加入）报告总大小。22.8基线见根规则。
name: detached_parts_exist
title: "发现detached part"
severity: info
description: |
  一个或多个表的detached/目录中存在part。part会在merge失败、手动detach操作
  或replication冲突后进入detached状态。它们占用磁盘空间，但不参与查询服务。
  查看'reason'列，判断每个part是可以安全删除
  （ALTER TABLE … DROP DETACHED PART）还是重新挂载。
# 扫描逐表数据：在essential采集中不运行。
tier: full
tags:
  - storage
  - parts
  - maintenance

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:detached_parts_exist
source:
  - system.detached_parts
query: |
  SELECT
    database,
    table,
    count()                                  AS detached_count,
    formatReadableSize(sum(bytes_on_disk))   AS total_size,
    groupArray(reason)                       AS reasons
  FROM {sys.detached_parts}
  -- system databases skipped before the per-table listing (see the collector)
  WHERE database NOT IN ('system', 'information_schema', 'INFORMATION_SCHEMA')
    AND {detached_scope}
  GROUP BY database, table
  ORDER BY sum(bytes_on_disk) DESC

message: "{database}.{table}有{detached_count}个detached part，总计{total_size}（原因：{reasons}）"
