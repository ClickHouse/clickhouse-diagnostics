name: replication_queue_errors
title: "Replication queue entries with errors"
severity: critical
description: |
  One or more entries in the replication queue have a non-empty last_exception.
  This usually means a replica is unable to apply a replication log entry —
  common causes include network issues, disk full, schema mismatches, or
  corrupt data parts. Left unresolved, the replica will fall behind and may
  require manual intervention to recover.
tags:
  - replication
  - reliability

query: |
  SELECT
    database,
    table,
    replica_name,
    type,
    toString(create_time)  AS create_time,
    num_tries,
    last_exception
  FROM {sys.replication_queue}
  WHERE last_exception != ''
  ORDER BY create_time DESC
  LIMIT 50

# Follow-ups the dashboard shows under a fired alert, for the customer to run
# on their own cluster (never run by the tool; read-only, validated like query).
investigate:
  - title: "Stuck entries grouped by table, type and error"
    # The error key is the message's start with every number replaced by N:
    # one cause stays one row although its text carries part names and
    # counters, and two causes ("disk full", "connection refused") never share one.
    query: |
      SELECT database, table, type,
             replaceRegexpAll(substring(last_exception, 1, 200), '[0-9]+', 'N') AS error,
             count() AS entries, max(num_tries) AS max_tries, min(create_time) AS oldest,
             any(substring(last_exception, 1, 300)) AS example_error
      FROM {sys.replication_queue}
      WHERE last_exception != ''
      GROUP BY database, table, type, error
      ORDER BY entries DESC
      LIMIT 50
  - title: "Replica health for the tables with a queue"
    query: |
      SELECT database, table, is_readonly, is_session_expired, queue_size, inserts_in_queue,
             merges_in_queue, absolute_delay, substring(last_queue_update_exception, 1, 300) AS last_queue_update_exception
      FROM {sys.replicas}
      WHERE queue_size > 0 OR is_readonly
      ORDER BY absolute_delay DESC
      LIMIT 50

message: "{database}.{table} (replica {replica_name}): {type} failed after {num_tries} tries — {last_exception}"
