name: replication_queue_errors
title: "replication queue中存在错误的条目"
severity: critical
description: |
  replication queue（复制队列）中一个或多个条目的last_exception非空。
  这通常意味着replica无法应用某条replication log条目——常见原因包括
  网络问题、磁盘写满、schema不匹配或数据part损坏。若未解决，
  该replica会落后，可能需要人工干预才能恢复。
tags:
  - replication
  - reliability

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:replication_queue_errors
source:
  - system.replication_queue
query: |
  SELECT
    database,
    table,
    replica_name,
    type,
    toString(create_time)  AS create_time,
    num_tries,
    last_exception
  FROM {sys.replication_queue}
  WHERE last_exception != ''
  ORDER BY create_time DESC
  LIMIT 50

# 在触发的告警下方，dashboard会展示这些后续查询，供客户在自己的集群上运行
# （工具从不执行；只读，并按query的标准校验）。
investigate:
  - title: "按表、类型和错误分组的卡住条目"
    # error键是message开头并把每个数字替换为N：
    # 同一个原因仍是一行，尽管其文本带有part名和计数器；而两个原因
    # （“disk full”、“connection refused”）绝不会共用一行。
    query: |
      SELECT database, table, type,
             replaceRegexpAll(substring(last_exception, 1, 200), '[0-9]+', 'N') AS error,
             count() AS entries, max(num_tries) AS max_tries, min(create_time) AS oldest,
             any(substring(last_exception, 1, 300)) AS example_error
      FROM {sys.replication_queue}
      WHERE last_exception != ''
      GROUP BY database, table, type, error
      ORDER BY entries DESC
      LIMIT 50
  - title: "有队列的表的replica健康状况"
    query: |
      SELECT database, table, is_readonly, is_session_expired, queue_size, inserts_in_queue,
             merges_in_queue, absolute_delay, substring(last_queue_update_exception, 1, 300) AS last_queue_update_exception
      FROM {sys.replicas}
      WHERE queue_size > 0 OR is_readonly
      ORDER BY absolute_delay DESC
      LIMIT 50

message: "{database}.{table}（replica {replica_name}）：{type}在{num_tries}次尝试后失败——{last_exception}"
