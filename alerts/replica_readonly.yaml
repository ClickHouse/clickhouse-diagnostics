name: replica_readonly
title: "replica进入read-only模式"
severity: critical
description: |
  一个或多个replicated表处于read-only模式。在此状态下，受影响的表
  接受SELECT查询，但所有INSERT和DDL操作都会被拒绝。read-only模式
  通常由以下原因引起：
  - Keeper/ZooKeeper会话丢失或过期
  - 磁盘写满
  - 网络分区使replica与Keeper隔离
  - 元数据损坏，需要手动恢复

  根因解决后，replica会尝试自动恢复。如果几分钟内未恢复，
  请检查Keeper连通性和服务器日志（system.text_log）以获取错误详情。
tags:
  - replication
  - reliability
  - keeper

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:replica_readonly
source:
  - system.replicas
  - system.replicas_problem_tables
query: |
  SELECT
    database,
    table,
    is_session_expired,
    absolute_delay,
    active_replicas,
    total_replicas
  FROM {sys.replicas}
  -- active_replicas / total_replicas are read from Keeper; system.replicas
  -- filters on database/table first, so naming the read-only tables keeps
  -- that read to them instead of every replicated table on the server.
  WHERE (database, table) IN (SELECT database, table FROM {sys.replicas} WHERE is_readonly = 1)
    AND is_readonly = 1

message: "{database}.{table}处于read-only模式（session_expired={is_session_expired}，delay={absolute_delay}s，active_replicas={active_replicas}/{total_replicas}）"
