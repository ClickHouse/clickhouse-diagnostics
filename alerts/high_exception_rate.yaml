name: high_exception_rate
title: "High query exception rate for one error code in an hour"
severity: warning
description: |
  More than 50 query exceptions with the same exception code occurred
  within a single hour of the last 24 hours (one alert instance per hour
  and code, worst 24 first). A sustained rate like this usually points to
  a systematic problem — a misbehaving client, a schema mismatch, missing
  permissions, resource limits being hit, or an outage of a dependency
  (Keeper, object storage) — rather than isolated bad queries.

  The window is a day rather than an hour because bundles are usually
  collected after recovery; an hour-only rule would miss the incident.

  Investigate: use the example message and exception code to identify the
  affected queries; check whether one user or one query pattern
  (normalized_query_hash) dominates; correlate the hour with metric_log,
  part_log and text_log.
tags:
  - exceptions
  - reliability
  - query-log

query: |
  SELECT
    toStartOfHour(event_time) AS hour,
    exception_code,
    count()                   AS error_count,
    any(exception)            AS example_message
  FROM {sys.query_log}
  WHERE event_time > now() - INTERVAL 24 HOUR
    AND exception_code != 0
    AND type = 'ExceptionWhileProcessing'
  GROUP BY hour, exception_code
  HAVING error_count > 50
  ORDER BY error_count DESC
  LIMIT 24

message: "Exception code {exception_code} fired {error_count} times in the hour starting {hour} — example: {example_message}"
