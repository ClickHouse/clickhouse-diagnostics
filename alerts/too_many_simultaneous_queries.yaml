name: too_many_simultaneous_queries
title: "Too many simultaneous queries (code 202)"
severity: warning
description: |
  More than 10 queries failed with "Too many simultaneous queries"
  (exception code 202, TOO_MANY_SIMULTANEOUS_QUERIES) in the last hour. This means the server hit its
  max_concurrent_queries limit. Clients will receive immediate errors
  rather than waiting.

  Common causes: a traffic spike, runaway queries piling up, or a
  misconfigured connection pool sending too many parallel requests.
  Check system.processes for currently running queries and consider
  tuning max_concurrent_queries or max_concurrent_select_queries in
  the server configuration.
tags:
  - concurrency
  - performance
  - query-log

# Evaluated by the Go check over the files already collected (no second
# query to the server). query: below is the same test in SQL, for the
# customer to run live; the check mirrors it.
check: go:too_many_simultaneous_queries
source:
  - system.query_log_details_7_days
  - system.version
query: |
  SELECT
    count()       AS error_count,
    any(exception) AS example_message
  FROM {sys.query_log}
  WHERE event_time > now() - INTERVAL 1 HOUR
    AND exception_code = 202
  HAVING error_count > 10

message: "Too many simultaneous queries (code 202) occurred {error_count} times in the last hour — example: {example_message}"
