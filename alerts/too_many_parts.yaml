name: too_many_parts
title: "Table partition approaching too-many-parts limit"
severity: warning
description: |
  A table partition has more than 300 active parts. ClickHouse starts
  throttling inserts at 1000 parts per partition (code 497) and may
  fully block writes before that threshold. High part counts indicate
  that background merges are not keeping up with insert throughput —
  common causes include excessive insert frequency, an unfavourable
  partition key that creates too many narrow partitions, or a blocked
  merge pool.

  Investigate: check system.merges for active/queued merges, look at
  insert throughput, and consider tuning max_insert_block_size or the
  partition key.
tags:
  - parts
  - performance
  - inserts
  - merges

query: |
  SELECT
    database,
    table,
    partition_id,
    count()  AS parts_count
  FROM {sys.parts}
  WHERE active = 1
    AND database NOT IN ('system','information_schema','INFORMATION_SCHEMA')
  GROUP BY database, table, partition_id
  HAVING parts_count > 300
  ORDER BY parts_count DESC

message: "{database}.{table} partition '{partition_id}' has {parts_count} active parts — inserts may be throttled (code 497 at 1000 parts)"
