name: mutation_running_too_long
title: "检测到长时间运行的mutation"
severity: warning
description: |
  某个mutation已运行超过3小时。长时间运行的mutation会阻塞merge、
  在执行期间占用额外磁盘空间，并降低写入性能。如果不再需要，
  考虑终止（kill）该mutation，或排查根本原因。
tags:
  - mutations
  - performance

# {sys.mutations}在运行时替换：
#   onprem / gov  →  system.mutations
#   cloud         →  clusterAllReplicas(default, system.mutations)
#
# 注意：toString(create_time)投影被别名到*_str，以免该别名在WHERE
# 子句中遮蔽DateTime源列。在CH 25+中，analyzer会按SELECT别名解析标识符，
# 因此在create_time被别名为String的情况下，
# `dateDiff('hour', create_time, now())`会抛出ILLEGAL_TYPE_OF_ARGUMENT。
#
# 24.1+变体：通过24.1加入system.mutations的is_killed = 0
# 排除已kill的mutation。根变体在列不存在的旧服务器上省略该过滤。
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:mutation_running_too_long
source:
  - system.mutations
  - system.version
query: |
  SELECT
    database,
    table,
    mutation_id,
    command,
    toString(create_time)                          AS create_time_str,
    dateDiff('hour', create_time, now())           AS hours_running,
    parts_to_do
  FROM {sys.mutations}
  WHERE parts_to_do > 0
    AND is_killed = 0
    AND dateDiff('hour', create_time, now()) > 3
  ORDER BY hours_running DESC

# {column_name}占位符由每个结果行填充。
message: "{database}.{table}上的mutation {mutation_id}已运行{hours_running}小时，还剩{parts_to_do}个part——开始于{create_time_str}"
