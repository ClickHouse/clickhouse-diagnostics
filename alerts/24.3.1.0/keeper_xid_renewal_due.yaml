# 仅24.3层级：system.zookeeper_connection.xid在24.3中加入。没有根规则——
# 在旧服务器上该检查不适用，而不是失败。
name: keeper_xid_renewal_due
title: "Keeper会话请求计数器距32位上限不足一天"
severity: info
description: |
  Keeper会话用计数器（xid）为其请求编号。使用默认的32位计数器时，
  客户端在达到2^31时必须打开新会话：旧会话的在途操作会失败一次，
  该replica上出现一小阵ZooKeeperHardwareExceptions和少量999 / 319，
  然后继续运行。按每秒8–12k请求计算，每个replica大约每63小时发生一次。
  本规则报告这样的会话：按其主机实际观测到的速率，剩余余量将在24小时内
  耗尽——这样彼时的一阵Keeper异常可以被理解为一次续期，而不是Keeper故障。

  它是信息性的，且刻意保守。它报告的是余量，而不是确定性，因为系统表中
  没有任何信息表明会话计数器的位宽：

    * 在`<zookeeper>`配置中启用`use_xid_64`时（24.10起可用），
      计数器为64位，会话永远不会在2^31处续期。该设置未暴露在
      system.settings、system.server_settings、system.zookeeper_connection
      或Keeper feature flags中（在26.7上检查过），因此本规则无法测试它——
      在把报告的余量当作将会发生的续期之前，请查看bundle的`configuration/`
      中的`<zookeeper>`。xid已超过2^31的会话可证明是64位，因此在这里
      被排除。
    * 速率来自该host的ZooKeeperTransactions，它是host级指标，而每个配置的
      Keeper连接（默认连接和每个辅助`<zookeeper>`）都有自己的xid。
      因此，有多个活动连接的host会被跳过，而不是把另一个会话的流量折进来
      做预测。
    * 速率除以metric_log实际覆盖的时间跨度，而不是固定的24小时；
      样本不足2小时的host完全不预测——否则今早刚重启的服务器看起来会比
      实际安静四倍，从而错过续期。

  续期本身不需要任何操作。只有当那些分钟里insert失败时，它才成为finding——
  在异常爆发时查看`query_log`中失败的INSERT（或`asynchronous_insert_log`
  中失败的flush），而不是`system.error_log`，后者还会统计没有任何查询
  看到的background Keeper错误，且24.8之前不存在——或者当某个replica
  续期频率远超其速率预测时，那是会话丢失而非计数器耗尽
  （见keeper_connection_blips）。
tags:
  - keeper

# 逐连接，且仅在host流量可归因于单个会话时。在cloud中，两个{sys.*}
# 都会fan out，按hostName()连接即可对齐；在单节点上两侧都是该节点。
# 读取system.zookeeper_connection：需要一个活动的Keeper会话。
needs: keeper
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:keeper_xid_renewal_due
source:
  - system.zookeeper_connection
  - system.metric_log_7_days
  - system.metric_log_by_host_3_days
  - system.version
query: |
  WITH
    conn AS
    (
      SELECT
        hostName()        AS hostname,
        count()           AS sessions,
        any(name)         AS connection_name,
        any(host)         AS keeper_host,
        max(xid)          AS xid
      FROM {sys.zookeeper_connection}
      WHERE is_expired = 0
      GROUP BY hostname
    ),
    rate AS
    (
      SELECT
        hostName()                                           AS hostname,
        sum(ProfileEvent_ZooKeeperTransactions)              AS tx,
        dateDiff('second', min(event_time), max(event_time)) AS covered_s,
        -- The measured rate, computed once and used for both the predicate
        -- and the projections. An earlier version floored it with
        -- greatest(rate, 0.001) in the projections only, so a genuinely quiet
        -- session was admitted on its real rate and then reported against the
        -- floor: 8 transactions over 86 399 s with xid at 2 147 483 640 came
        -- out as 1.9 h of headroom where the predicate had accepted it at
        -- 21.0 h. nullIf guards the division instead of a floor, so zero
        -- coverage yields NULL and the row drops out of the predicate below.
        tx / nullIf(covered_s, 0)                            AS measured_tx_per_s
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname
    )
  SELECT
    c.hostname                                                        AS hostname,
    c.connection_name                                                 AS connection_name,
    c.keeper_host                                                     AS keeper_host,
    c.xid                                                             AS xid,
    round(r.measured_tx_per_s, 2)                                     AS tx_per_s,
    round(r.covered_s / 3600, 1)                                      AS measured_over_h,
    round((2147483647 - c.xid) / r.measured_tx_per_s / 3600, 1)       AS headroom_h,
    round(2147483647 / r.measured_tx_per_s / 3600, 1)                 AS period_at_this_rate_h
  FROM conn AS c
  INNER JOIN rate AS r USING (hostname)
  WHERE c.sessions = 1
    AND c.xid > 0
    AND c.xid < 2147483647
    AND r.covered_s >= 7200
    AND r.measured_tx_per_s > 0
    AND (2147483647 - c.xid) / r.measured_tx_per_s < 86400
  ORDER BY headroom_h
  LIMIT 100

message: "{hostname}：{keeper_host}上的Keeper会话'{connection_name}'处于2^31的xid {xid}，速率为{tx_per_s} req/s（在{measured_over_h}小时内测得）——约剩{headroom_h}小时余量，按此速率计数器约每{period_at_this_rate_h}小时耗尽一次。在默认32位计数器上，它届时会续期：该replica上出现一小阵Keeper异常，已处理。检查<zookeeper>（configuration/）中的use_xid_64——启用后就不会续期。"
