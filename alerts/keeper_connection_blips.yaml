name: keeper_connection_blips
title: "一小时内Keeper连接丢失而流量保持正常"
severity: warning
description: |
  最近7天的某一小时内ZooKeeperHardwareExceptions超过1000次，同时该replica
  仍完成了自身常规Keeper事务的至少一半（该replica在同一7天窗口内的
  每小时ZooKeeperTransactions中位数）。测试是逐replica进行的：
  集群级求和会让汇集起来的、没有任何单节点经历过的异常越过阈值。
  一次会话丢失后又重新建立——Keeper leader变更、某个Keeper节点重启、
  网络抖动——而Keeper并未不可用。流量同时崩溃的小时由keeper_health
  报告。

  反复的blip值得关注：它们会中止进行中的merge和insert（999 / 319），
  并迫使replica重新检查自身状态。完全没有流量基线的服务器
  （中位数为0——刚启动或整个窗口确实空闲）不会触发：那里的“正常流量”
  无法定义，dashboard会相应标记这类小时。

  排查：该小时的text_log中'Finalizing session' / 'Connected to ZooKeeper'
  （服务器迁移到了哪个Keeper主机）、当时Keeper日志中的leader选举、
  该小时的part_log错误。
tags:
  - keeper
  - reliability

# {sys.metric_log}——逐replica，因此在cloud模式下经clusterAllReplicas
# fan out。每小时聚合和基线中位数都必须按hostName()分组：单个集群级桶会把
# 每个replica的异常加总，使>1000阈值容易N倍越过，并报告一个没有任何单节点
# 经历过的“blip”。必须与keeper_health保持精确互补（同样两个信号，
# transactions >= 0.5 * 基线而不是<），因此分组方式也必须与它一致。
#
# 在gov中安全：告警行绝不会离开本机——alerts_summary.json只记录计数
# （internal/alert/alert.go WriteSummaryJSON），而gov从不生成dashboard，
# 那是匹配行的唯一其他消费者。
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:keeper_connection_blips
source:
  - system.metric_log_7_days
  - system.metric_log_by_host_3_days
  - system.version
query: |
  WITH per_hour AS
    (
      SELECT
        hostName()                                     AS hostname,
        toStartOfHour(event_time)                      AS hour,
        sum(ProfileEvent_ZooKeeperHardwareExceptions)  AS hw_exceptions,
        sum(ProfileEvent_ZooKeeperTransactions)        AS transactions
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 7 DAY
      GROUP BY hostname, hour
    ),
    baseline AS
    (
      SELECT hostname, quantileExactHigh(0.5)(transactions) AS usual
      FROM per_hour
      GROUP BY hostname
    )
  SELECT
    p.hostname                                         AS hostname,
    p.hour                                             AS hour,
    p.hw_exceptions                                    AS hw_exceptions,
    p.transactions                                     AS transactions,
    round(100 * p.transactions / greatest(b.usual, 1)) AS pct_of_usual
  FROM per_hour AS p
  INNER JOIN baseline AS b ON p.hostname = b.hostname
  WHERE b.usual > 0
    AND p.hw_exceptions > 1000
    AND p.transactions >= 0.5 * b.usual
  ORDER BY hour, hostname
  LIMIT 168 BY hostname

message: "{hostname}上从{hour}开始的一小时：{hw_exceptions}次Keeper hardware exception，同时流量保持在常规的{pct_of_usual}%（{transactions}次事务）——会话丢失后重新建立"
