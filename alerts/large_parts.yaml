name: large_parts
title: "单个part超过150 GB"
severity: warning
description: |
  单个活跃数据part在磁盘上超过150 GB。过大的part会拖慢merge、
  增加查询期间的内存压力，并使备份/恢复操作变慢。考虑检查受影响表的分区键，
  让part能被更细粒度地拆分。
# 扫描逐表数据：在essential采集中不运行。
tier: full
tags:
  - storage
  - parts
  - performance

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:large_parts
source:
  - system.parts
query: |
  SELECT
    database,
    table,
    name                                                AS part_name,
    disk_name,
    formatReadableSize(bytes_on_disk)                  AS size_on_disk,
    bytes_on_disk,
    formatReadableSize(data_uncompressed_bytes)        AS uncompressed_size,
    round(data_uncompressed_bytes / data_compressed_bytes, 2) AS compression_ratio,
    rows,
    toString(modification_time)                        AS modification_time
  FROM {sys.parts}
  WHERE active = 1
    AND bytes_on_disk > 150 * 1024 * 1024 * 1024
  ORDER BY bytes_on_disk DESC

message: "{database}.{table}的part {part_name}位于磁盘'{disk_name}'上，大小为{size_on_disk}（压缩比{compression_ratio}x）"
