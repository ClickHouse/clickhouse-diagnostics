name: merges_stalled
title: "整小时内插入了part但没有任何merge完成"
severity: warning
description: |
  最近24小时的一个或多个小时里，system.part_log在某个replica上记录了
  超过100次NewPart事件，且成功的MergeParts事件为零。
  测试是逐replica进行的：merge按节点分配，集群级计数为零要求所有replica
  同时停滞，会漏掉一个节点卡住而其同伴正常merge的常见情况。
  insert不断创建part，却没有任何merge处理它们——一旦达到
  parts_to_delay_insert / parts_to_throw_insert，这种状态最终会变成
  TOO_MANY_PARTS（错误码252）。

  常见原因：Keeper不可用（replicated / shared表上的merge通过Keeper分配）、
  merge pool饱和或暂停（SYSTEM STOP MERGES），或每次merge都失败
  （见failed_merges和background_operation_failures告警）。

  排查：同一小时的metric_log（ZooKeeperHardwareExceptions、
  BackgroundMergesAndMutationsPoolTask）、system.merges、逐分区查看
  system.parts、text_log中的'Temporarily pause scheduling'。
tags:
  - parts
  - merges
  - keeper

# {sys.part_log}——part_log是逐replica的，因此在cloud模式下经
# clusterAllReplicas fan out。只按小时分组会把每个replica加总到一个桶里，
# 而`merges = 0`随之要求没有任何replica在整个小时内做过任何merge：
# 规则将永远无法针对常见故障（健康同伴中有一个卡住的节点）触发。
# hostName()把测试按replica拆分，并指出需要处理的节点。
#
# 在gov中安全：告警行绝不会离开本机——alerts_summary.json只记录计数
# （internal/alert/alert.go WriteSummaryJSON），而gov从不生成dashboard，
# 那是匹配行的唯一其他消费者。
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:merges_stalled
source:
  - system.part_log_3_days
  - system.version
query: |
  SELECT
    hostName()                                                    AS hostname,
    toStartOfHour(event_time)                                     AS hour,
    countIf(event_type = 'NewPart')                               AS new_parts,
    countIf(event_type = 'MergeParts' AND error = 0)              AS merges,
    countIf(event_type = 'MergeParts' AND error != 0)             AS failed_merges
  FROM {sys.part_log}
  WHERE event_time > now() - INTERVAL 24 HOUR
  GROUP BY hostname, hour
  HAVING new_parts > 100 AND merges = 0
  ORDER BY hour, hostname

message: "{hostname}上从{hour}开始的一小时：插入了{new_parts}个part，完成0次merge（{failed_merges}次merge失败）——该replica上merge没有运行"
