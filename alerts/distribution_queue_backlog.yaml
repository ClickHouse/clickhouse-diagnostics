name: distribution_queue_backlog
title: "Distributed queue backlog"
severity: warning
description: |
  An async Distributed table writes each insert into a local directory, one
  per shard, and a background thread sends those files on. This rule fires
  when a directory has stopped sending, holds files the server could not
  parse, or has already failed to send.

  One row is one shard directory. Two directories of the same table are two
  findings — they are not summed.

  data_files is how many files are waiting for the next flush. A healthy
  table has those between flushes, so data_files > 0 does not fire this
  rule. The triggers are is_blocked = 1, broken_data_files > 0, or
  error_count > 0. last_exception is the text of the last send failure
  (often empty when the directory is merely blocked).

  Left alone, the directory grows until inserts fail with code 574
  (DISTRIBUTED_TOO_MANY_PENDING_BYTES, bytes_to_throw_insert). This is not
  the replication queue and not the distributed DDL queue: the files are
  per-node local state, so a cloud run reads every replica.
tags:
  - distributed
  - reliability

# Evaluated by the Go check over the files already collected (no second
# query to the server). query: below is the same test in SQL, for the
# customer to run live; the check mirrors it. data_files is reported and
# is not part of the predicate.
check: go:distribution_queue_backlog
source:
  - system.distribution_queue
query: |
  SELECT
    hostName() AS hostname,
    database,
    table,
    data_path,
    is_blocked,
    broken_data_files,
    error_count,
    data_files,
    last_exception
  FROM {sys.distribution_queue}
  WHERE is_blocked = 1
     OR broken_data_files > 0
     OR error_count > 0
  ORDER BY is_blocked DESC, broken_data_files DESC, error_count DESC
  LIMIT 50

investigate:
  - title: "Shard directories with a backlog, including byte sizes"
    query: |
      SELECT
        hostName() AS hostname,
        database,
        table,
        data_path,
        is_blocked,
        error_count,
        data_files,
        data_compressed_bytes,
        broken_data_files,
        broken_data_compressed_bytes,
        substring(last_exception, 1, 300) AS last_exception
      FROM {sys.distribution_queue}
      WHERE is_blocked = 1
         OR broken_data_files > 0
         OR error_count > 0
      ORDER BY is_blocked DESC, broken_data_files DESC, error_count DESC
      LIMIT 50

message: "{hostname} {database}.{table} ({data_path}): is_blocked={is_blocked}, broken_data_files={broken_data_files}, error_count={error_count}, data_files={data_files} — {last_exception}"
