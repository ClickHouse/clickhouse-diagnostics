name: detached_parts_exist
title: "Detached parts found"
severity: info
description: |
  There are parts in the detached/ folder of one or more tables.
  Parts end up detached after failed merges, manual detach operations,
  or replication conflicts. They consume disk space but are not served
  to queries. Review the 'reason' column to decide whether each part can
  be safely dropped (ALTER TABLE … DROP DETACHED PART) or re-attached.
tags:
  - storage
  - parts
  - maintenance

# Root variant for the oldest supported servers (22.8–22.10):
# detached_parts.bytes_on_disk was added in 22.11 — see
# 22.11.1.0/detached_parts_exist.yaml for the variant that reports size.
query: |
  SELECT
    database,
    table,
    count()                                  AS detached_count,
    groupArray(reason)                       AS reasons
  FROM {sys.detached_parts}
  GROUP BY database, table
  ORDER BY detached_count DESC

message: "{database}.{table} has {detached_count} detached part(s) (reason(s): {reasons})"
