name: parts_propagation_lag
title: "某个replica在part上落后（SharedMergeTree传播延迟）"
severity: warning
description: |
  在SharedMergeTree集群上，每个replica维护自己的system.parts视图，
  并异步获知新part：Keeper说某个part存在，随后该replica去fetch它。
  落后的replica对同一查询返回的行数少于其兄弟节点，而且差距会持续扩大，
  直到fetch slot释放。

  报告两类情况，均来自对system.parts的一次扫描：

    * 某个replica在某分区中的最新block比任何replica的最新block至少
      落后32。block号在每个分区内单调递增，因此该差值就是该replica
      尚未获取的block的真实数量。下限是一个完整的调度轮次——
      shared_merge_tree_parts_load_batch_size，默认32——因此insert过程中
      的普通传播差距不会触发它。
    * 某个replica在某个分区中完全没有活跃part，而该分区在最近一天内有
      写入。这样的replica不会为逐分区比较贡献任何行，因此必须通过从表
      的replica集合中减去该分区的replica集合来发现它；否则最坏的情况——
      某个replica一个新分区都没fetch——反而是唯一被读作健康的情况。
      一天窗口让这一点在collector的逐host上限（保留每个replica最近写入
      的分区并丢弃最旧的）下仍然安全。

  刻意不是持续时间。两个replica上最新modification_time之差是时钟偏移，
  不是缺失block的年龄：空闲一段时间后它会很大，即便缺失的block只有几秒
  历史；几秒内写入的一批数据会让它保持很小，无论replica落后多久；
  落后replica上的一次merge会刷新它，却不缩小block差距。
  max_newest_part_skew_s仅作为佐证报告。要了解replica落后了多久，
  请读取system.replicas——absolute_delay和inserts_oldest_time是服务器
  自己的答案，逐replica，就在同一个bundle中。

  常见原因：后台fetch或schedule pool饱和（告警fetch_pool_saturated /
  schedule_pool_saturated，HC-2.13 / 2.14）——fetch executor没有队列，
  因此需要比空闲slot更多fetch的表会静默退避。重启只能清空积压，直到
  pool再次填满；长久的修复是pool大小、更少更大的insert、更少的表。
  完整的逐分区列表在采集文件system.parts_max_block_by_replica中。
# 扫描逐表数据：在essential采集中不运行。
tier: full
tags:
  - replication
  - shared-merge-tree
  - capacity

# 仅cloud：比较需要每个replica的system.parts，只有clusterAllReplicas
# fan out才能提供（在每种模式下{sys.parts}都只在一个节点上读取，因为
# 对于普通cloud读取，system.parts是共享表）。在单节点上规则没有可比对象，
# 会被跳过。
modes: [cloud]

# 与queries.cloud/system.parts_max_block_by_replica.sql形状相同：在单次
# fan out上使用窗口函数（CTE读取两次会fan out两次），每个replica贡献其
# 最近写入的20000个分区。按分区，窗口携带每个replica的最新block以及
# 完全没有block的replica，因此两类发现来自同一次扫描；LIMIT 1 BY保证
# 每个分区一行，ARRAY JOIN再把它变回每个落后replica一行。
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:parts_propagation_lag
source:
  - system.parts_max_block_by_replica
  - system.version
query: |
  SELECT
    hostname,
    count()                                                                 AS partitions_affected,
    countIf(no_parts_at_all = 1)                                            AS partitions_not_fetched,
    max(blocks_behind)                                                      AS max_blocks_behind,
    argMax(concat(database, '.', table, ' / ', partition_id), blocks_behind) AS worst_partition,
    max(newest_part_skew_s)                                                 AS max_newest_part_skew_s
  FROM
  (
    SELECT
      database, table, partition_id,
      j.1 AS hostname, j.2 AS blocks_behind, j.3 AS no_parts_at_all, j.4 AS newest_part_skew_s
    FROM
    (
      SELECT
        database, table, partition_id,
        arrayConcat(
          arrayMap(x -> (x.1, toInt64(cluster_max_block) - toInt64(x.2), toUInt8(0),
                         toInt64(dateDiff('second', x.3, cluster_last_part_time))),
                   arrayFilter(x -> toInt64(cluster_max_block) - toInt64(x.2) >= 32, blocks)),
          arrayMap(h -> (h, toInt64(cluster_max_block), toUInt8(1), toInt64(0)),
                   if(cluster_last_part_time > now() - INTERVAL 1 DAY, missing, []))
        ) AS lagging
      FROM
      (
        SELECT
          database, table, partition_id,
          max(max_block)      OVER w_part AS cluster_max_block,
          max(last_part_time) OVER w_part AS cluster_last_part_time,
          groupArray((hostname, max_block, last_part_time)) OVER w_part AS blocks,
          arrayFilter(h -> NOT has(groupUniqArray(hostname) OVER w_part, h),
                      groupUniqArray(hostname) OVER w_tab) AS missing
        FROM
        (
          SELECT
            hostName()             AS hostname,
            database, table, partition_id,
            max(max_block_number)  AS max_block,
            max(modification_time) AS last_part_time
          FROM clusterAllReplicas(default, system.parts)
          WHERE active
            AND database NOT IN ('system', 'information_schema', 'INFORMATION_SCHEMA')
          GROUP BY hostname, database, table, partition_id
          ORDER BY hostname, last_part_time DESC
          LIMIT 20000 BY hostname
        )
        WINDOW w_part AS (PARTITION BY database, table, partition_id),
               w_tab  AS (PARTITION BY database, table)
      )
      LIMIT 1 BY database, table, partition_id
    )
    ARRAY JOIN lagging AS j
  )
  GROUP BY hostname
  ORDER BY max_blocks_behind DESC
  LIMIT 100

# 在触发的告警下方，dashboard会展示这些后续查询，供客户在自己的集群上运行
# （工具从不执行；只读，并按query的标准校验）。
investigate:
  - title: "当前每个background pool在每replica上的情况：忙碌slot与其大小对比"
    query: |
      SELECT t.hostname AS hostname, t.pool AS pool, t.busy AS busy, s.size AS size,
             round(100 * t.busy / greatest(s.size, 1)) AS pct_busy
      FROM
      (
        SELECT hostName() AS hostname, replaceRegexpOne(metric, '^Background(.+)PoolTask$', '\\1') AS pool, value AS busy
        FROM {sys.metrics}
        WHERE metric LIKE 'Background%PoolTask'
      ) AS t
      LEFT JOIN
      (
        SELECT hostName() AS hostname, replaceRegexpOne(metric, '^Background(.+)PoolSize$', '\\1') AS pool, value AS size
        FROM {sys.metrics}
        WHERE metric LIKE 'Background%PoolSize'
      ) AS s USING (hostname, pool)
      ORDER BY pct_busy DESC, hostname, pool
      LIMIT 200
  - title: "最近24小时每个pool在每replica上的小时峰值（忙碌slot及pool大小）"
    query: |
      SELECT
        hostName() AS hostname,
        toStartOfHour(event_time) AS hour,
        COLUMNS('^CurrentMetric_Background(MergesAndMutations|Fetches|Common|Move|Schedule)Pool(Task|Size)$') APPLY max
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname, hour
      ORDER BY hostname, hour
      LIMIT 1000

message: "{hostname}：在{partitions_affected}个分区上落后（其中{partitions_not_fetched}个完全没有fetch任何part），最差的是{worst_partition}，落后最新replica {max_blocks_behind}个block——要了解落后多久请读取system.replicas的absolute_delay，而不是{max_newest_part_skew_s}秒的最新part偏移"
