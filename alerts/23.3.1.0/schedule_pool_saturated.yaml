# 23.3 override: background_*_pool_size moved from system.settings to
# system.server_settings in 23.3. system.settings still LISTS the names on
# newer servers, with the old session-setting defaults (8 / 128) rather than
# the server's real sizes (16 / 512), so the root rule would compare against
# the wrong denominator there — this override reads the table that is right.
name: schedule_pool_saturated
title: "Background schedule pool saturated for hours"
severity: warning
description: |
  In at least 3 of the last 24 hours the hourly average of
  CurrentMetric_BackgroundSchedulePoolTask on a replica was at or above 95% of
  background_schedule_pool_size. The schedule pool runs every table's periodic
  tasks — parts-set updates, replication queue processing and cleanup, TTL and
  MV refresh scheduling — one task at a time per slot; with tens of thousands
  of replicated tables it is the first pool to pin. When it is full the tasks
  are not lost, they are late: a table's "parts updated" task waits for a slot,
  so on SharedMergeTree new parts become visible minutes to hours after they
  were written, and the replication queue on ReplicatedMergeTree is processed
  behind schedule. A restart empties the pool only until the same tables fill
  it again. The lasting fix is capacity: background_schedule_pool_size (a
  server setting read at startup — plan a restart; default 512), fewer
  replicated tables per replica, fewer tiny partitions.

  Check: metric_log_7_days avg_/max_schedule_pool_tasks per hour against the
  size; system.tables count of Replicated*/Shared* engines; alongside
  fetch_pool_saturated (both pinned on every replica is the capacity
  signature); on SMT, per-replica max_block_number for a hot table.
tags:
  - background-pools
  - capacity
  - replication

# Per replica (hostName()): a cluster-wide average would hide one saturated
# node among idle ones. The pool size is read from {sys.server_settings};
# in cloud mode that table fans out too, so max() folds the replicas' values
# (they are the same on a homogeneous cluster) into one scalar.
query: |
  WITH (
      SELECT max(toUInt64OrZero(value))
      FROM {sys.server_settings}
      WHERE name = 'background_schedule_pool_size'
    ) AS pool_size,
    per_hour AS
    (
      SELECT
        hostName()                              AS hostname,
        toStartOfHour(event_time)               AS hour,
        avg(CurrentMetric_BackgroundSchedulePoolTask) AS avg_tasks
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname, hour
    )
  SELECT
    hostname,
    count()                                              AS hours_saturated,
    round(avg(avg_tasks), 1)                             AS avg_tasks_in_pool,
    pool_size,
    round(100 * avg(avg_tasks) / greatest(pool_size, 1)) AS pct_of_size
  FROM per_hour
  WHERE pool_size > 0
    AND avg_tasks >= 0.95 * pool_size
  GROUP BY hostname
  HAVING hours_saturated >= 3
  ORDER BY hours_saturated DESC, hostname
  LIMIT 100

message: "{hostname}: background schedule pool at {pct_of_size}% of its size ({avg_tasks_in_pool} of background_schedule_pool_size = {pool_size}) for {hours_saturated} of the last 24 hours"
