# 23.3覆盖：background_*_pool_size在23.3从system.settings迁移到
# system.server_settings。在较新服务器上system.settings仍会列出这些名称，
# 但使用旧的session setting默认值（8 / 128），而不是服务器的真实大小
# （16 / 512），因此根规则在那里会与错误的分母比较——本覆盖读取正确的表。
name: fetch_pool_saturated
title: "后台fetch pool持续数小时饱和"
severity: warning
description: |
  最近24小时中至少有3个小时，某个replica上
  CurrentMetric_BackgroundFetchesPoolTask的小时均值达到或超过
  background_fetches_pool_size的90%。饱和的pool是一个没有队列的队列：
  找不到空闲slot的工作会被丢弃，并静默地稍后重试。
  对于fetch pool（background_fetches_pool_size，默认16），executor
  恰好有这么多slot且没有队列：一张调度32个part fetch的表只能拿到
  碰巧空闲的slot，其assignee会退避。
  在SharedMergeTree集群上，fetch pool饱和意味着新part在该replica上
  会延迟数分钟到数小时才可见——读取返回的行数少于在兄弟replica上执行
  同一查询的结果，而重启只能缓解到pool再次填满为止。长久的修复是容量：
  pool大小（fetch pool在配置重载时生效）、更少更大的insert、
  更少的表和part。

  排查：每小时将metric_log_7_days的avg_/max_fetch_pool_tasks与pool大小
  对比；每小时part_log的DownloadPart；在SMT上，查看热表的逐replica
  max_block_number（跨replica的system.parts）。
tags:
  - background-pools
  - capacity
  - replication

# 两侧都按replica（hostName()）分组：集群级平均值会掩盖空闲节点中某一个
# 饱和节点；而集群级pool大小会在各replica大小不同时，用另一个replica的
# 分母来比较本replica的占用。在cloud模式下{sys.server_settings}也会
# fan out，因此按hostname连接会让每个replica与自己的大小配对；在单节点上
# 两侧都是该节点。
# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:fetch_pool_saturated
source:
  - system.metric_log_7_days
  - system.metric_log_by_host_3_days
  - system.server_settings
  - system.settings
  - system.version
query: |
  WITH sizes AS
    (
      SELECT
        hostName()                    AS hostname,
        max(toUInt64OrZero(value))    AS pool_size
      FROM {sys.server_settings}
      WHERE name = 'background_fetches_pool_size'
      GROUP BY hostname
    ),
    per_hour AS
    (
      SELECT
        hostName()                              AS hostname,
        toStartOfHour(event_time)               AS hour,
        avg(CurrentMetric_BackgroundFetchesPoolTask) AS avg_tasks
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname, hour
    )
  SELECT
    p.hostname                                             AS hostname,
    count()                                                AS hours_saturated,
    round(avg(p.avg_tasks), 1)                             AS avg_tasks_in_pool,
    any(s.pool_size)                                       AS pool_size,
    round(100 * avg(p.avg_tasks) / greatest(any(s.pool_size), 1)) AS pct_of_size
  FROM per_hour AS p
  INNER JOIN sizes AS s USING (hostname)
  WHERE s.pool_size > 0
    AND p.avg_tasks >= 0.9 * s.pool_size
  GROUP BY p.hostname
  HAVING hours_saturated >= 3
  ORDER BY hours_saturated DESC, hostname
  LIMIT 100

# 在触发的告警下方，dashboard会展示这些后续查询，供客户在自己的集群上运行
# （工具从不执行；只读，并按query的标准校验）。
investigate:
  - title: "当前每个background pool在每replica上的情况：忙碌slot与其大小对比"
    query: |
      SELECT t.hostname AS hostname, t.pool AS pool, t.busy AS busy, s.size AS size,
             round(100 * t.busy / greatest(s.size, 1)) AS pct_busy
      FROM
      (
        SELECT hostName() AS hostname, replaceRegexpOne(metric, '^Background(.+)PoolTask$', '\\1') AS pool, value AS busy
        FROM {sys.metrics}
        WHERE metric LIKE 'Background%PoolTask'
      ) AS t
      LEFT JOIN
      (
        SELECT hostName() AS hostname, replaceRegexpOne(metric, '^Background(.+)PoolSize$', '\\1') AS pool, value AS size
        FROM {sys.metrics}
        WHERE metric LIKE 'Background%PoolSize'
      ) AS s USING (hostname, pool)
      ORDER BY pct_busy DESC, hostname, pool
      LIMIT 200
  - title: "最近24小时每个pool在每replica上的小时峰值（忙碌slot及pool大小）"
    query: |
      SELECT
        hostName() AS hostname,
        toStartOfHour(event_time) AS hour,
        COLUMNS('^CurrentMetric_Background(MergesAndMutations|Fetches|Common|Move|Schedule)Pool(Task|Size)$') APPLY max
      FROM {sys.metric_log}
      WHERE event_time > now() - INTERVAL 24 HOUR
      GROUP BY hostname, hour
      ORDER BY hostname, hour
      LIMIT 1000

message: "{hostname}：background fetch pool达到其大小的{pct_of_size}%（{avg_tasks_in_pool} / background_fetches_pool_size = {pool_size}），最近24小时中有{hours_saturated}小时如此"
