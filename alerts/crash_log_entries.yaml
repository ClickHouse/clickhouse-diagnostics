name: crash_log_entries
title: "检测到服务器崩溃"
severity: critical
description: |
  system.crash_log表中存在一条或多条记录，意味着ClickHouse服务器已崩溃
  （收到SIGSEGV或SIGABRT等致命信号）。即使只发生一次崩溃也值得排查——
  检查每次事件发生时的服务器日志，并考虑提交support ticket。
tags:
  - stability
  - crash

# 由Go check在已采集的文件上评估（不会再次查询服务器）。下方query:是同一
# 测试的SQL版本，供客户在线执行；check镜像同一逻辑。
check: go:crash_log_entries
source:
  - system.crash_log
  - system.crash_log_presence
query: |
  SELECT
    toString(event_time)  AS event_time,
    signal,
    toString(thread_id)   AS thread_id,
    query_id,
    version
  FROM {sys.crash_log}
  ORDER BY event_time DESC
  LIMIT 20

message: "服务器在{event_time}发生崩溃——signal {signal}，version {version}，query_id：{query_id}"
